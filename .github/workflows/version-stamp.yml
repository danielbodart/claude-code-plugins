name: version-stamp

on:
  push:
    branches: [trunk]
    paths-ignore:
      - '.claude-plugin/marketplace.json'

jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version from commit count
        run: |
          VERSION="1.0.$(git rev-list --count HEAD)"
          echo "Version: $VERSION"
          jq --arg v "$VERSION" '.plugins[].version = $v' \
            .claude-plugin/marketplace.json > tmp.json
          mv tmp.json .claude-plugin/marketplace.json

      - name: Commit if changed
        run: |
          git diff --quiet .claude-plugin/marketplace.json && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: stamp version [skip ci]"
          git push
